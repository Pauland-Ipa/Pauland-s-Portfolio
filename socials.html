    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <nav>
        <div class="logo">My Portfolio</div>
        <ul class="nav-links" id="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>

        <div class="nav-right">
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                <span class="material-symbols-outlined" id="theme-icon">light_mode</span>
            </button>
            <div class="social-icons desktop-only">
                <a href="https://www.linkedin.com/in/pauland-ipa-1b25602a9" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                <a href="https://github.com/Pauland-Ipa" target="_blank"><i class="fa-brands fa-github"></i></a>
            </div>
            <a href="assets/resume.pdf" class="resume-btn" target="_blank">Resume</a>
            <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <section class="section-container" style="padding-top: 150px; min-height: 60vh;">
        <h2 class="section-title reveal">Connect with Me</h2>
        <div class="socials-list reveal">
            <a href="https://www.facebook.com/share/1E3hBJ15D4/" class="social-link-item" target="_blank">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>
            <a href="https://www.threads.net/@paulandipa_" class="social-link-item" target="_blank">
                <i class="fa-brands fa-threads"></i> Threads
            </a>
            <a href="https://www.linkedin.com/in/pauland-ipa-1b25602a9" class="social-link-item" target="_blank">
                <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>
            <a href="https://github.com/Pauland-Ipa" class="social-link-item" target="_blank">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
        </div>
    </section>

    <section id="contact" class="contact-section reveal">
        <div class="contact-content">
            <h2 class="section-title">Contact Me</h2>
            <p>My email: <span id="email-text">ppawlenchumil@gmail.com</span> 
                <button id="copy-btn" class="icon-btn" title="Copy to clipboard">
                    <span class="material-symbols-outlined" style="font-size: 1.2rem;">content_copy</span>
                </button>
            </p>
            <form id="contact-form">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="btn-primary">Send Message</button>
                <div id="success-animation" class="hidden">
                    <div class="paper-plane"></div>
                    <p>Message Ready!</p>
                </div>
            </form>
        </div>
    </section>

    <button id="back-to-top" title="Go to top">
        <span class="material-symbols-outlined">arrow_upward</span>
    </button>
